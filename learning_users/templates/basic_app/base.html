<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="{% static "bootstrap-5.3.8-dist/css/bootstrap.min.css" %}">
    <link rel="stylesheet" href="{% static "bootstrap-5.3.8-dist/css/bootstrap-grid.min.css" %}">
    <link rel="stylesheet" href="{% static "bootstrap-5.3.8-dist/css/bootstrap-reboot.min.css" %}">
    <link rel="stylesheet" href="{% static "bootstrap-5.3.8-dist/css/bootstrap-utilities.min.css" %}">
</head>
<body>
    <nav class="navbar navbar-default navbar-static-top">
        <div class="container">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-brand" href="{% url 'index' %}">DJANGO</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'admin:index' %}">Admin</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'basic_app:register' %}">Register</a></li>

                {% if user.is_authenticated %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Logout</a></li>
                {% else %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'basic_app:user_login' %}">Login</a></li>
                {% endif %}        

            </ul>
        </div>
    </nav>
    <div class="container">
        {% block body_block %}
        {% endblock %} 
    </div>
    
</body>
</html>
